<form id="mfaform" method="post" (ngSubmit)="launch()">
  <div class="mfa-container">
    <div class="mfa-info">
      <uds-translate>Login Verification</uds-translate>
    </div>

    <div class="mfa-stack">
      <div class="mfa-brand" aria-hidden="true">
        <img [src]="api.staticURL('modern/img/login-img.png')" alt="">
      </div>

      <div class="mfa-form">
        <div class="mfa-field">
          <mat-form-field>
            <mat-label>
              {{ api.config.mfa.label }}
            </mat-label>
            <input matInput id="code" name="code" value="" required autofocus />
          </mat-form-field>
        </div>

        @if (api.config.mfa.remember_device !== '') {
          <div class="mfa-field mfa-remember">
            <mat-checkbox id="remember" name="remember">
              <uds-translate>Remember me for</uds-translate> {{ api.config.mfa.remember_device }}
            </mat-checkbox>
          </div>
        }
        @if (api.config.mfa.remember_device === '') {
          <input type="hidden" name="remember" value="0"/>
        }

        <div class="mfa-button">
          <button mat-stroked-button color="primary" type="submit">
            <uds-translate>Submit</uds-translate>
          </button>
        </div>

        @if (api.config.mfa.html) {
          <div class="mfa-html-wrapper" [class.expanded]="qrExpanded">
            <button type="button" class="mfa-qr-toggle"
                    (click)="toggleQr()"
                    [attr.aria-label]="qrExpanded ? 'Shrink QR' : 'Enlarge QR'"
                    [title]="qrExpanded ? 'Shrink QR' : 'Enlarge QR'">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                @if (qrExpanded) {
                  <path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                } @else {
                  <path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                }
              </svg>
            </button>
            <div class="mfa-html" [innerHtml]="api.config.mfa.html | safeHtml"></div>
          </div>
        }
      </div>
    </div>
  </div>
</form>
